name: Build Dongwon HUB apps
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'desktop/**', '.github/workflows/dongwon-apps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unsigned APK
        env:
          SKIP_SIGN: '1'
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          bash mobile/android/build.sh
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" mobile/android/build/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging mobile/android/build/DongwonHUB-Android-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hub-android-unsigned
          path: |
            mobile/android/build/DongwonHUB-Android-unsigned.apk
            mobile/android/build/apksigner.jar
          retention-days: 14
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop build tools
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: hub-windows-installer
          path: desktop-dist/*.exe
          retention-days: 30
